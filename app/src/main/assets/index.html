function drawGlow(spr, x, y, w) {
  if (!spr) return;
  const h = w;
  ctx.drawImage(spr, x - w / 2, y - h / 2, w, h);
}

function rr(x, y, w, h, r) {
  if (w <= 0 || h <= 0) { ctx.beginPath(); return; }
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function txt(s, x, y, size, color, align, weight) {
  ctx.font = (weight || 600) + ' ' + size + 'px ' + FONT;
  ctx.fillStyle = color || '#fff';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}

function bar(x, y, w, h, frac, color) {
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  rr(x, y, w, h, h / 2);
  ctx.fill();
  const f = clamp(frac, 0, 1);
  if (f > 0.001) {
    ctx.fillStyle = color;
    rr(x, y, Math.max(h, w * f), h, h / 2);
    ctx.fill();
  }
}

function wrapText(text, maxW, size, weight) {
  ctx.font = (weight || 500) + ' ' + size + 'px ' + FONT;
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; }
    else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

// ═══════ SHAPE PRIMITIVES — Reusable polygon/shape drawers ═══════
function _poly(n, r) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) { const a = i/n*TAU; i ? ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r) : ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r); }
  ctx.closePath();
}
function _tri(r, h) { ctx.beginPath(); ctx.moveTo(0,-r*(h||1.3)); ctx.lineTo(r,r*0.9); ctx.lineTo(-r,r*0.9); ctx.closePath(); }
function _diamond(r, h) { ctx.beginPath(); ctx.moveTo(0,-r*(h||1.2)); ctx.lineTo(r,0); ctx.lineTo(0,r*(h||1.2)); ctx.lineTo(-r,0); ctx.closePath(); }
function _chevron(r) { ctx.beginPath(); ctx.moveTo(0,-r*1.4); ctx.lineTo(r,r*0.8); ctx.lineTo(0,r*0.2); ctx.lineTo(-r,r*0.8); ctx.closePath(); }
function _star(pts, r, ir) {
  ctx.beginPath();
  for (let i = 0; i < pts; i++) {
    const a1 = i/pts*TAU, a2 = (i+0.5)/pts*TAU;
    i===0 ? ctx.moveTo(Math.cos(a1)*r, Math.sin(a1)*r) : ctx.lineTo(Math.cos(a1)*r, Math.sin(a1)*r);
    ctx.lineTo(Math.cos(a2)*r*(ir||0.55), Math.sin(a2)*r*(ir||0.55));
  }
  ctx.closePath();
}
function _bossShape(r) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i/8*TAU, rad = r*(i%2?0.72:1); i ? ctx.lineTo(Math.cos(a)*rad, Math.sin(a)*rad) : ctx.moveTo(Math.cos(a)*rad, Math.sin(a)*rad); }
  ctx.closePath();
}
// ═══════════════════════════════════════════════════════════════
// DIVERSE HOSTILE ENEMY CRAFT & BOSS FLAGSHIP RENDERERS
// ═══════════════════════════════════════════════════════════════

function _drawBossShip(e, now, bt) {
  const r = e.r;
  const enraged = e.hp <= e.maxHp * 0.5;
  const mainCol = e.flash > 0 ? '#ff9f1c' : (enraged ? (bt.eCol || '#ff2a4b') : (e.col || '#ea580c'));
  const glowCol = enraged ? '#ff0033' : '#ff6b35';

  if (e.kit === 0) {
    // Kit 0: INFERNO DRAKE (Draconic Heavy Battleship)
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.3); // Nose rammer
    ctx.lineTo(-r * 0.35, -r * 0.8);
    ctx.lineTo(-r * 1.25, r * 0.1); // Swept dragon wing
    ctx.lineTo(-r * 0.5, r * 0.45);
    ctx.lineTo(-r * 0.4, r * 0.85); // Left thruster
    ctx.lineTo(0, r * 0.65);
    ctx.lineTo(r * 0.4, r * 0.85); // Right thruster
    ctx.lineTo(r * 0.5, r * 0.45);
    ctx.lineTo(r * 1.25, r * 0.1);
    ctx.lineTo(r * 0.35, -r * 0.8);
    ctx.closePath();
    ctx.fillStyle = mainCol;
    ctx.fill();
    ctx.strokeStyle = '#991b1b';
    ctx.lineWidth = 2.5 * S;
    ctx.stroke();

    // Reactor Core
    ctx.fillStyle = enraged ? '#ff0033' : '#ff781f';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.38, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#ffb703'; ctx.lineWidth = 1.5 * S; ctx.stroke();

  } else if (e.kit === 1) {
    // Kit 1: VORTEX TITAN (Spiked Citadel Dreadnought)
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU;
      const rad = r * (i % 2 === 0 ? 1.15 : 0.65);
      i === 0 ? ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad) : ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fillStyle = mainCol;
    ctx.fill();
    ctx.strokeStyle = '#7c2d12';
    ctx.lineWidth = 2.5 * S;
    ctx.stroke();

    // Quad Shield Pylons
    for (let k = 0; k < 4; k++) {
      const pa = k * Math.PI / 2 + now * 0.002;
      ctx.fillStyle = '#f43f5e';
      ctx.beginPath();
      ctx.arc(Math.cos(pa) * r * 0.72, Math.sin(pa) * r * 0.72, r * 0.22, 0, TAU);
      ctx.fill();
    }

  } else if (e.kit === 2) {
    // Kit 2: STORM SENTINEL (Twin-Hull Stealth Titan)
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(side * r * 0.55, -r * 1.2);
      ctx.lineTo(side * r * 0.95, -r * 0.3);
      ctx.lineTo(side * r * 0.85, r * 0.8);
      ctx.lineTo(side * r * 0.35, r * 0.7);
      ctx.lineTo(side * r * 0.35, -r * 0.4);
      ctx.closePath();
      ctx.fillStyle = mainCol;
      ctx.fill();
      ctx.strokeStyle = '#1e1b4b';
      ctx.lineWidth = 2 * S;
      ctx.stroke();
    }
    // Central Plasma Bridge
    ctx.fillStyle = '#4f46e5';
    ctx.fillRect(-r * 0.35, -r * 0.25, r * 0.7, r * 0.6);
    ctx.fillStyle = '#ff2a4b';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.28, 0, TAU); ctx.fill();

  } else if (e.kit === 3) {
    // Kit 3: NEXUS CORE (Orbital Laser Cannon Platform)
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.25); // Heavy forward focusing emitter
    ctx.lineTo(-r * 0.45, -r * 0.5);
    ctx.lineTo(-r * 1.1, -r * 0.1);
    ctx.lineTo(-r * 0.95, r * 0.65);
    ctx.lineTo(-r * 0.35, r * 0.85);
    ctx.lineTo(0, r * 0.5);
    ctx.lineTo(r * 0.35, r * 0.85);
    ctx.lineTo(r * 0.95, r * 0.65);
    ctx.lineTo(r * 1.1, -r * 0.1);
    ctx.lineTo(r * 0.45, -r * 0.5);
    ctx.closePath();
    ctx.fillStyle = mainCol;
    ctx.fill();
    ctx.strokeStyle = '#831843';
    ctx.lineWidth = 2.5 * S;
    ctx.stroke();

    // Iris Laser Cannon Muzzle
    ctx.fillStyle = '#dc2626';
    ctx.beginPath(); ctx.arc(0, -r * 0.85, r * 0.25, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ff0055';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.35, 0, TAU); ctx.fill();

  } else {
    // Kit 4: CHRONOS PRIME (Temporal Void Dreadnought)
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.1);
    ctx.lineTo(-r * 1.2, r * 0.25);
    ctx.lineTo(-r * 0.75, r * 0.9);
    ctx.lineTo(0, r * 0.45);
    ctx.lineTo(r * 0.75, r * 0.9);
    ctx.lineTo(r * 1.2, r * 0.25);
    ctx.closePath();
    ctx.fillStyle = mainCol;
    ctx.fill();
    ctx.strokeStyle = '#581c87';
    ctx.lineWidth = 2.5 * S;
    ctx.stroke();

    // Temporal Distortion Core
    ctx.fillStyle = '#c026d3';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.4, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 2 * S; ctx.stroke();
  }

  // Thruster Fire Plumes
  if (e.isDashing > 0 || Math.sin(now * 0.02) > 0) {
    ctx.fillStyle = '#ff6b35';
    ctx.beginPath();
    ctx.moveTo(-r * 0.3, r * 0.7);
    ctx.lineTo(r * 0.3, r * 0.7);
    ctx.lineTo(0, r * (e.isDashing > 0 ? 1.6 : 1.1));
    ctx.closePath();
    ctx.fill();
  }
}

function _drawStandardEnemy(e, now, th) {
  const r = e.r;
  const col = e.flash > 0 ? '#ff8533' : (e.col || th.body || '#ef4444');

  if (th.shape === 'tri' || e.type === 'chaser' || e.type === 'swarmer') {
    // 1. Sleek Twin-Pronged Interceptor / Needle Craft
    ctx.beginPath();
    ctx.moveTo(-r * 0.32, -r * 1.15); // Left prong
    ctx.lineTo(0, -r * 0.65);
    ctx.lineTo(r * 0.32, -r * 1.15);  // Right prong
    ctx.lineTo(r * 0.95, r * 0.35);   // Wingtip right
    ctx.lineTo(r * 0.35, r * 0.75);   // Thruster right
    ctx.lineTo(0, r * 0.45);
    ctx.lineTo(-r * 0.35, r * 0.75);  // Thruster left
    ctx.lineTo(-r * 0.95, r * 0.35);  // Wingtip left
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.lineWidth = 1.4 * S;
    ctx.stroke();

    // Sensor Slit Eye
    ctx.fillStyle = '#ff0033';
    ctx.fillRect(-r * 0.22, -r * 0.35, r * 0.44, r * 0.2);

  } else if (th.shape === 'chevron' || e.type === 'charger' || e.type === 'artillery') {
    // 2. Heavy Swept-Wing Armored Striker
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.15); // Needle nose
    ctx.lineTo(r * 0.35, -r * 0.4);
    ctx.lineTo(r * 1.1, r * 0.2);
    ctx.lineTo(r * 0.65, r * 0.8);
    ctx.lineTo(0, r * 0.35);
    ctx.lineTo(-r * 0.65, r * 0.8);
    ctx.lineTo(-r * 1.1, r * 0.2);
    ctx.lineTo(-r * 0.35, -r * 0.4);
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.lineWidth = 1.5 * S;
    ctx.stroke();

    // Heavy Weapon Pylons
    ctx.fillStyle = '#b91c1c';
    ctx.fillRect(-r * 0.65, -r * 0.1, r * 0.25, r * 0.55);
    ctx.fillRect(r * 0.4, -r * 0.1, r * 0.25, r * 0.55);

  } else if (th.shape === 'poly' || th.shape === 'rect' || e.type === 'tank' || e.type === 'mag_golem') {
    // 3. Heavy Armored Cruiser / Battle Tank
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.0);
    ctx.lineTo(r * 0.75, -r * 0.55);
    ctx.lineTo(r * 0.95, r * 0.4);
    ctx.lineTo(r * 0.5, r * 0.9);
    ctx.lineTo(-r * 0.5, r * 0.9);
    ctx.lineTo(-r * 0.95, r * 0.4);
    ctx.lineTo(-r * 0.75, -r * 0.55);
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();
    ctx.strokeStyle = '#450a0a';
    ctx.lineWidth = 1.8 * S;
    ctx.stroke();

    // Armored Center Hull
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.45, 0, TAU); ctx.fill();

  } else if (th.shape === 'star' || e.type === 'spinner' || e.type === 'cyb_turret') {
    // 4. Mechanical Octagonal Hunter Sentry
    ctx.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * TAU + e.rot * 0.5;
      const rad = r * (k % 2 ? 0.65 : 1.05);
      k === 0 ? ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad) : ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();
    ctx.strokeStyle = '#831843';
    ctx.lineWidth = 1.5 * S;
    ctx.stroke();

    // Center Targeting Eye
    ctx.fillStyle = '#ff2a4b';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.32, 0, TAU); ctx.fill();

  } else {
    // 5. Spiked Biomechanical Horror / Abyssal Craft
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.15);
    ctx.quadraticCurveTo(r * 0.8, -r * 0.4, r * 1.1, r * 0.15);
    ctx.lineTo(r * 0.5, r * 0.7);
    ctx.lineTo(0, r * 0.35);
    ctx.lineTo(-r * 0.5, r * 0.7);
    ctx.lineTo(-r * 1.1, r * 0.15);
    ctx.quadraticCurveTo(-r * 0.8, -r * 0.4, 0, -r * 1.15);
    ctx.closePath();
    ctx.fillStyle = col;
    ctx.fill();
    ctx.strokeStyle = '#581c87';
    ctx.lineWidth = 1.5 * S;
    ctx.stroke();

    ctx.fillStyle = '#c026d3';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.35, 0, TAU); ctx.fill();
  }
}

// Draw a single enemy with dynamic hostile silhouettes & orientation
function drawEnemyBody(e, now) {
  const th = THEME.en[e.type] || THEME.en.chaser;

  if (e.warnT > 0) {
    const pFrac = e.warnT / (e.boss ? 1.0 : 0.4);
    ctx.save();
    ctx.strokeStyle = e.col;
    ctx.lineWidth = 2 * S;
    ctx.setLineDash(THEME.vfx.warnDash.map(v => v * S));
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(now * THEME.vfx.warnPulse);
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r * (1 + pFrac * THEME.vfx.warnExpand), 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  drawGlow(e.boss ? SPR.boss : SPR.enemy, e.x, e.y, e.r * (e.boss ? 7.5 : 4.5));

  ctx.save();
  ctx.translate(e.x, e.y);

  // Orient towards flight heading or movement vector
  const facing = (e.heading !== undefined ? e.heading : (Math.atan2(G.player.y - e.y, G.player.x - e.x))) + Math.PI / 2;
  ctx.rotate(e.boss ? facing : (th.shape === 'star' ? e.rot : facing));

  if (e.boss) {
    const bt = THEME.boss[e.kit] || THEME.boss[0];
    _drawBossShip(e, now, bt);
  } else {
    _drawStandardEnemy(e, now, th);
  }

  ctx.restore();

  if (e.elite) {
    ctx.strokeStyle = THEME.vfx.eliteRing;
    ctx.lineWidth = THEME.vfx.eliteW * S;
    ctx.setLineDash(THEME.vfx.eliteDash.map(v => v * S));
    ctx.lineDashOffset = -now * 0.02;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 6 * S, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  if (e.burn) {
    ctx.strokeStyle = THEME.vfx.burnRing;
    ctx.lineWidth = THEME.vfx.burnW * S;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r + 4 * S, 0, TAU);
    ctx.stroke();
  }
}

// Draw the high-tech military supersonic Fighter Plane
function drawPlayerShip(p, now) {
  const L = p.r * 1.55;
  const W = p.r * 1.35;
  const facing = (p.hasAim ? p.aimAng : Math.atan2(p.lastDir.y, p.lastDir.x)) + Math.PI / 2;

  // Under-glow engine aura
  drawGlow(SPR.player, p.x, p.y, p.r * 7.5);

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(facing);

  // 1. Dual Supersonic Plasma Afterburners
  const isDash = p.dashT > 0;
  const boostPulse = 0.85 + 0.35 * Math.sin(now * 0.04);
  const flameLen = (isDash ? 2.8 : 1.2) * L * 0.55 * boostPulse;
  const flameW = W * 0.18;

  for (const side of [-1, 1]) {
    const ex = side * W * 0.28;
    const ey = L * 0.70;

    // Outer flame sheath
    ctx.beginPath();
    ctx.moveTo(ex - flameW, ey);
    ctx.lineTo(ex + flameW, ey);
    ctx.lineTo(ex, ey + flameLen);
    ctx.closePath();
    const fGrad = ctx.createLinearGradient(ex, ey, ex, ey + flameLen);
    if (isDash) {
      fGrad.addColorStop(0, '#ffffff');
      fGrad.addColorStop(0.3, '#ffd166');
      fGrad.addColorStop(1, 'rgba(255, 60, 0, 0)');
    } else {
      fGrad.addColorStop(0, '#ffffff');
      fGrad.addColorStop(0.3, '#38bdf8');
      fGrad.addColorStop(1, 'rgba(2, 132, 199, 0)');
    }
    ctx.fillStyle = fGrad;
    ctx.fill();

    // Inner shock diamond core
    ctx.beginPath();
    ctx.moveTo(ex - flameW * 0.45, ey);
    ctx.lineTo(ex + flameW * 0.45, ey);
    ctx.lineTo(ex, ey + flameLen * 0.55);
    ctx.closePath();
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }

  // 2. Main Swept-Delta Airframe with LERX (Leading-Edge Root Extensions)
  ctx.beginPath();
  // Nose radome tip
  ctx.moveTo(0, -L);
  // Port (Left) flank & chine
  ctx.lineTo(-W * 0.18, -L * 0.62);
  ctx.lineTo(-W * 0.28, -L * 0.25);
  // Swept delta leading edge to wingtip
  ctx.lineTo(-W * 1.15, L * 0.28);
  // Wingtip missile rail
  ctx.lineTo(-W * 1.15, L * 0.42);
  // Trailing edge with flaperon
  ctx.lineTo(-W * 0.46, L * 0.56);
  // Canted vertical tail fin
  ctx.lineTo(-W * 0.48, L * 0.82);
  ctx.lineTo(-W * 0.24, L * 0.72);
  // Engine nozzle left
  ctx.lineTo(-W * 0.12, L * 0.78);
  // Center beaver tail
  ctx.lineTo(0, L * 0.66);
  // Engine nozzle right
  ctx.lineTo(W * 0.12, L * 0.78);
  // Canted vertical tail fin right
  ctx.lineTo(W * 0.24, L * 0.72);
  ctx.lineTo(W * 0.48, L * 0.82);
  // Trailing edge right
  ctx.lineTo(W * 0.46, L * 0.56);
  // Wingtip right
  ctx.lineTo(W * 1.15, L * 0.42);
  ctx.lineTo(W * 1.15, L * 0.28);
  // Starboard leading edge
  ctx.lineTo(W * 0.28, -L * 0.25);
  ctx.lineTo(W * 0.18, -L * 0.62);
  ctx.closePath();

  // Dark stealth fuselage gradient with metallic sheen
  const bodyGrad = ctx.createLinearGradient(-W, 0, W, 0);
  bodyGrad.addColorStop(0, '#0f172a');
  bodyGrad.addColorStop(0.3, '#1e293b');
  bodyGrad.addColorStop(0.5, '#334155');
  bodyGrad.addColorStop(0.7, '#1e293b');
  bodyGrad.addColorStop(1, '#0f172a');
  ctx.fillStyle = bodyGrad;
  ctx.fill();

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
  ctx.lineWidth = 1.4 * S;
  ctx.stroke();

  // 3. Inner Wing Panels & Stealth Seams
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
  ctx.lineWidth = 1.0 * S;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s * W * 0.24, -L * 0.18);
    ctx.lineTo(s * W * 0.95, L * 0.26);
    ctx.lineTo(s * W * 0.44, L * 0.48);
    ctx.stroke();

    // Twin weapon hardpoint pods
    ctx.fillStyle = '#475569';
    ctx.fillRect(s * W * 0.72 - 2 * S, L * 0.08, 4 * S, 12 * S);
  }

  // 4. Supersonic Cockpit Canopy Glass (Faceted Stealth HUD)
  const canopyL = L * 0.48;
  const canopyW = W * 0.20;
  const canopyY = -L * 0.28;

  ctx.beginPath();
  ctx.moveTo(0, canopyY - canopyL * 0.55);
  ctx.lineTo(canopyW, canopyY);
  ctx.lineTo(canopyW * 0.7, canopyY + canopyL * 0.45);
  ctx.lineTo(0, canopyY + canopyL * 0.55);
  ctx.lineTo(-canopyW * 0.7, canopyY + canopyL * 0.45);
  ctx.lineTo(-canopyW, canopyY);
  ctx.closePath();

  const glassGrad = ctx.createLinearGradient(0, canopyY - canopyL * 0.5, 0, canopyY + canopyL * 0.5);
  glassGrad.addColorStop(0, '#bae6fd');
  glassGrad.addColorStop(0.4, '#38bdf8');
  glassGrad.addColorStop(1, '#0369a1');
  ctx.fillStyle = glassGrad;
  ctx.fill();

  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.2 * S;
  ctx.stroke();

  // Cockpit glare reflection line
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.lineWidth = 1.0 * S;
  ctx.beginPath();
  ctx.moveTo(-canopyW * 0.35, canopyY - canopyL * 0.3);
  ctx.lineTo(-canopyW * 0.15, canopyY + canopyL * 0.2);
  ctx.stroke();

  // 5. Wingtip Strobe Beacons
  const strobe = Math.sin(now * 0.01) > 0.3;
  if (strobe) {
    // Port: Red
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc(-W * 1.15, L * 0.35, 2.5 * S, 0, TAU); ctx.fill();
    // Starboard: Cyan
    ctx.fillStyle = '#10b981';
    ctx.beginPath(); ctx.arc(W * 1.15, L * 0.35, 2.5 * S, 0, TAU); ctx.fill();
  }

  // 6. Invulnerability Hexagonal Energy Field Flicker
  if (p.inv > 0) {
    const invAlpha = 0.4 + 0.35 * Math.sin(now * 0.03);
    ctx.strokeStyle = `rgba(56, 189, 248, ${invAlpha})`;
    ctx.lineWidth = 2 * S;
    ctx.beginPath();
    ctx.arc(0, 0, L * 1.15, 0, TAU);
    ctx.stroke();
  }

  ctx.restore();
}

// Play weapon SFX from THEME data (replaces inline beep calls)
function playWpSFX(wid, key) {
  const wt = THEME.wp[wid]; if (!wt) return;
  const s = key ? wt[key] : wt.sfx; if (!s) return;
  beep(s[0]+rand(-s[0]*0.04,s[0]*0.04), s[1], s[2], s[3], s[4]);
}

// Draw orbiting drone escorts (reads THEME.wp.drone)
function drawDroneOrbs(p) {
  const dt = THEME.wp.drone;
  const n = 1 + Math.floor((p.drone-1)/2);
  for (let i = 0; i < n; i++) {
    const a = G.t*1.8 + i*TAU/n;
    const dx = p.x+Math.cos(a)*64*S, dy = p.y+Math.sin(a)*64*S;
    drawGlow(SPR.cyan, dx, dy, 24*S);
    ctx.save(); ctx.translate(dx,dy); ctx.rotate(a+Math.PI/2);
    ctx.fillStyle = dt.body; ctx.strokeStyle = dt.stroke; ctx.lineWidth = 1.5*S;
    ctx.beginPath(); ctx.moveTo(0,-6*S); ctx.lineTo(5*S,0); ctx.lineTo(0,6*S); ctx.lineTo(-5*S,0); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = dt.core; ctx.beginPath(); ctx.arc(0,0,2.2*S,0,TAU); ctx.fill();
    ctx.restore();
  }
}

// Draw shield ring arcs (reads THEME.wp.shield)
function drawShieldRing(p, now) {
  const st = THEME.wp.shield;
  const rad = p.r + st.r*S;
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(now*st.spin);
  ctx.lineWidth = st.w*S;
  ctx.strokeStyle = p.shieldFlash>0 ? st.flash : st.col;
  for (let i = 0; i < st.segs; i++) {
    ctx.beginPath(); ctx.arc(0,0,rad, i*TAU/st.segs+st.gap, (i+1)*TAU/st.segs-st.gap); ctx.stroke();
  }
  if (p.shieldFlash > 0) {
    ctx.globalAlpha = p.shieldFlash/0.45;
    ctx.beginPath(); ctx.arc(0,0,rad+8*S,0,TAU); ctx.stroke();
  }
  ctx.restore();
}

// Draw laser beam layers (reads THEME.wp.laser)
function drawLaserBeam(p, now) {
  const lt = THEME.wp.laser;
  const tr = p.trees.laser || {};
  const beamW = (tr[1]==='wide' ? 24 : lt.coreW) * S;
  const split = tr[2]==='split';
  let target = nearestEnemy(p.x,p.y);
  let baseAng = target ? Math.atan2(target.y-p.y,target.x-p.x) : Math.atan2(p.lastDir.y,p.lastDir.x);
  const angles = split ? [baseAng-0.22,baseAng+0.22] : [baseAng];
  ctx.save();
  for (const ang of angles) {
    const len = W*0.85;
    const ex = p.x+Math.cos(ang)*len, ey = p.y+Math.sin(ang)*len;
    ctx.strokeStyle = lt.outerCol; ctx.lineWidth = beamW*lt.outerWM;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.strokeStyle = lt.coreCol; ctx.lineWidth = beamW;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.strokeStyle = lt.centerCol; ctx.lineWidth = beamW*lt.centerWM;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(ex,ey); ctx.stroke();
  }
  ctx.restore();
}

// Draw black hole VFX (reads THEME.wp.hole)
function drawHoleVFX(h, now) {
  const ht = THEME.wp.hole;
  const hg = ctx.createRadialGradient(h.x,h.y,h.r*0.08, h.x,h.y,h.r*1.28);
  hg.addColorStop(0,ht.inner); hg.addColorStop(0.5,ht.mid); hg.addColorStop(1,ht.outer);
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(h.x,h.y,h.r*1.28,0,TAU); ctx.fill();
  ctx.save(); ctx.translate(h.x,h.y); ctx.rotate(now*ht.spin);
  ctx.strokeStyle = ht.ring; ctx.lineWidth = ht.ringW*S;
  for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(0,0,h.r*(0.5+k*0.24),k*TAU/3,k*TAU/3+1.6); ctx.stroke(); }
  ctx.restore();
}

// Draw nuke projectile (reads THEME.wp.nuke)
function drawNukeProj(n) {
  const nt = THEME.wp.nuke;
  drawGlow(SPR.gold, n.x, n.y, n.r*6);
  ctx.save(); ctx.translate(n.x,n.y); ctx.rotate(Math.atan2(n.vy,n.vx));
  ctx.fillStyle = nt.body; rr(-n.r,-n.r*0.5,n.r*2,n.r,3*S); ctx.fill();
  ctx.fillStyle = nt.nose; ctx.fillRect(n.r*0.3,-n.r*0.3,n.r*0.6,n.r*0.6);

}

// Draw disk projectile (reads THEME.wp.disk)
function drawDiskProj(d, now) {
  const dt = THEME.wp.disk;
  drawGlow(SPR.green, d.x, d.y, d.r*6);
  ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(now*dt.spin);
  ctx.fillStyle = dt.col; ctx.beginPath();
  for (let k = 0; k < dt.spokes; k++) {
    const a = k/dt.spokes*TAU;
    const x1=Math.cos(a)*d.r, y1=Math.sin(a)*d.r;
    const x2=Math.cos(a+0.3)*d.r*dt.inR, y2=Math.sin(a+0.3)*d.r*dt.inR;
    k===0 ? ctx.moveTo(x1,y1) : ctx.lineTo(x1,y1); ctx.lineTo(x2,y2);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

// Draw void rift VFX (reads THEME.wp.wormhole)
function drawRiftVFX(rf, now) {

// Draw lightning bolts (reads THEME.wp.zap)
function drawZapBolts(now) {
  const zt = THEME.wp.zap;
  for (const z of G.zaps) {
    const a = clamp(z.life/z.max,0,1);
    ctx.save();
    ctx.globalAlpha = a*0.35; ctx.strokeStyle = zt.outer; ctx.lineWidth = zt.outerW*S;
    ctx.beginPath(); z.pts.forEach((pt,i) => i ? ctx.lineTo(pt.x,pt.y) : ctx.moveTo(pt.x,pt.y)); ctx.stroke();
    ctx.globalAlpha = a; ctx.strokeStyle = zt.inner; ctx.lineWidth = zt.innerW*S;
    ctx.beginPath(); z.pts.forEach((pt,i) => i ? ctx.lineTo(pt.x,pt.y) : ctx.moveTo(pt.x,pt.y)); ctx.stroke();

}

function drawBg(now) {
  const envKey = (G && G.env) || meta.env || 'nebula';
  const envCfg = ENVIRONMENTS[envKey] || ENVIRONMENTS.nebula;
  const curBgGrad = ctx.createRadialGradient(W * 0.5, H * 0.2, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.85);
  curBgGrad.addColorStop(0, envCfg.bg[0]);
  curBgGrad.addColorStop(0.55, envCfg.bg[1]);
  curBgGrad.addColorStop(1, envCfg.bg[2]);
  ctx.fillStyle = curBgGrad;
  ctx.fillRect(0, 0, W, H);

  // Parallax Nebula Clouds (Slow distant layer: 8% camera speed)
  for (const neb of nebulae) {
    const nx = (((neb.x * W - cam.x * 0.08) % W) + W) % W;
    const ny = (((neb.y * H - cam.y * 0.08) % H) + H) % H;
    const nr = Math.max(W, H) * neb.r;
    const ngrad = ctx.createRadialGradient(nx, ny, 0, nx, ny, nr);
    ngrad.addColorStop(0, `rgba(${neb.col},0.08)`);
    ngrad.addColorStop(0.5, `rgba(${neb.col},0.035)`);
    ngrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ngrad;
    ctx.fillRect(0, 0, W, H);
  }

  // Multi-tier Parallax Stars (Mid layer: 22% camera speed)
  for (const s of stars) {
    const sx = (((s.x - cam.x * 0.22) % W) + W) % W;
    const sy = (((s.y - cam.y * 0.22) % H) + H) % H;
    const tw = 0.55 + 0.45 * Math.sin(now * 0.001 * s.sp + s.ph);
    ctx.globalAlpha = 0.2 + 0.55 * tw;
    ctx.fillStyle = s.tier === 3 ? '#ffecb3' : s.tier === 2 ? '#cdd6ff' : '#9ca3af';
    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Floating flame embers (Near layer: 50% camera speed)
  for (const e of embers) {
    const ey = (((e.y - now * 0.001 * e.sp - cam.y * 0.5) % H) + H) % H;
    const ex = (((e.x + Math.sin(now * 0.0004 + e.ph) * e.dr - cam.x * 0.5) % W) + W) % W;
    ctx.globalAlpha = e.a * (0.6 + 0.4 * Math.sin(now * 0.003 + e.ph));
    ctx.fillStyle = '#ff8a3d';
    ctx.beginPath();
    ctx.arc(ex, ey, e.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Screen Damage / Powerup Flashes
  if (G) {
    if (G.hitFlash > 0) {
      ctx.fillStyle = `rgba(255,40,60,${G.hitFlash * 0.45})`;
      ctx.fillRect(0, 0, W, H);
    }
    if (G.powerFlash > 0) {
      ctx.fillStyle = `rgba(123,255,178,${G.powerFlash * 0.35})`;
      ctx.fillRect(0, 0, W, H);
    }
  }
}

// ═══════ WORLD GRID & BOUNDARIES ═══════
function drawWorldGrid(cam, now) {
  const gridSize = 120 * S;
  const startX = Math.floor(cam.x / gridSize) * gridSize;
  const startY = Math.floor(cam.y / gridSize) * gridSize;
  const endX = cam.x + W + gridSize;
  const endY = cam.y + H + gridSize;

  const envKey = (G && G.env) || meta.env || 'nebula';
  const envCfg = ENVIRONMENTS[envKey] || ENVIRONMENTS.nebula;

  ctx.save();
  ctx.strokeStyle = envCfg.gridCol || 'rgba(255, 255, 255, 0.04)';
  ctx.lineWidth = 1 * S;
  ctx.beginPath();
  for (let x = startX; x <= endX; x += gridSize) {
    if (x >= 0 && x <= worldW) {
      ctx.moveTo(x, Math.max(0, cam.y));
      ctx.lineTo(x, Math.min(worldH, cam.y + H));
    }
  }
  for (let y = startY; y <= endY; y += gridSize) {
    if (y >= 0 && y <= worldH) {
      ctx.moveTo(Math.max(0, cam.x), y);
      ctx.lineTo(Math.min(worldW, cam.x + W), y);
    }
  }
  ctx.stroke();

  // Subtle intersection points for strong sense of directional velocity
  ctx.fillStyle = 'rgba(255, 140, 60, 0.12)';
  for (let x = startX; x <= endX; x += gridSize) {
    if (x < 0 || x > worldW) continue;
    for (let y = startY; y <= endY; y += gridSize) {
      if (y < 0 || y > worldH) continue;
      ctx.fillRect(x - 1.5 * S, y - 1.5 * S, 3 * S, 3 * S);
    }
  }
  ctx.restore();
}

function drawWorldWalls(cam, now) {
  ctx.save();
  const pulse = 0.6 + 0.4 * Math.sin(now * 0.005);
  ctx.strokeStyle = `rgba(255, 60, 90, ${0.45 * pulse})`;
  ctx.lineWidth = 6 * S;
  ctx.strokeRect(3 * S, 3 * S, worldW - 6 * S, worldH - 6 * S);

  ctx.strokeStyle = '#ff4d6d';
  ctx.lineWidth = 2 * S;
  ctx.strokeRect(0, 0, worldW, worldH);
  ctx.restore();
}

function drawAimReticle(p) {
  const ang = (p.hasAim ? p.aimAng : (nearestEnemy(p.x, p.y) ? Math.atan2(nearestEnemy(p.x, p.y).y - p.y, nearestEnemy(p.x, p.y).x - p.x) : Math.atan2(p.lastDir.y, p.lastDir.x)));
  const dist = 70 * S;
  const ax = p.x + Math.cos(ang) * dist;
  const ay = p.y + Math.sin(ang) * dist;

  ctx.save();
  ctx.strokeStyle = 'rgba(255, 200, 100, 0.28)';
  ctx.lineWidth = 1.2 * S;
  ctx.setLineDash([4 * S, 6 * S]);
  ctx.beginPath();
  ctx.moveTo(p.x + Math.cos(ang) * (p.r + 4 * S), p.y + Math.sin(ang) * (p.r + 4 * S));
  ctx.lineTo(ax, ay);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255, 220, 120, 0.65)';
  ctx.lineWidth = 1.5 * S;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.arc(ax, ay, 4 * S, 0, TAU);
  ctx.stroke();
  ctx.restore();
}

function drawMinimap(cam) {
  if (mode !== MODE.PLAY || !G) return;
  const p = G.player;
  const mapW = 80 * S, mapH = 48 * S;
  const mapX = W - mapW - 14 * S, mapY = 14 * S;

  ctx.save();
  ctx.fillStyle = 'rgba(10, 8, 20, 0.75)';
  rr(mapX, mapY, mapW, mapH, 6 * S);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 120, 60, 0.45)';
  ctx.lineWidth = 1.2 * S;
  rr(mapX, mapY, mapW, mapH, 6 * S);
  ctx.stroke();

  // Viewport camera rect
  const vx = mapX + (cam.x / worldW) * mapW;
  const vy = mapY + (cam.y / worldH) * mapH;
  const vw = Math.max(2, (W / worldW) * mapW);
  const vh = Math.max(2, (H / worldH) * mapH);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(vx, vy, vw, vh);

  // Gems & coins (cyan dots)
  ctx.fillStyle = '#6ee7ff';
  for (let i = 0; i < G.gems.length; i += 3) {
    const gm = G.gems[i];
    ctx.fillRect(mapX + (gm.x / worldW) * mapW, mapY + (gm.y / worldH) * mapH, 1.2, 1.2);
  }

  // Enemies (red dots) & Boss (gold pulsing)
  ctx.fillStyle = '#ff4d6d';
  for (const e of G.enemies) {
    if (e.boss) {
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(mapX + (e.x / worldW) * mapW, mapY + (e.y / worldH) * mapH, 3 * S, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#ff4d6d';
    } else {
      ctx.fillRect(mapX + (e.x / worldW) * mapW - 0.8, mapY + (e.y / worldH) * mapH - 0.8, 1.8, 1.8);
    }
  }

  // Player dot (bright green)
  const px = mapX + (p.x / worldW) * mapW;
  const py = mapY + (p.y / worldH) * mapH;
  ctx.fillStyle = '#7bffb2';
  ctx.beginPath();
  ctx.arc(px, py, 2.5 * S, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawVirtualJoysticks() {
  if (mode !== MODE.PLAY || !G) return;

  // Move Joystick (Left)
  if (touchMove && touchMove.active) {
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.beginPath();
    ctx.arc(touchMove.startX, touchMove.startY, 46 * S, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 140, 60, 0.45)';
    ctx.lineWidth = 2 * S;
    ctx.stroke();

    ctx.fillStyle = 'rgba(255, 140, 60, 0.8)';
    ctx.beginPath();
    ctx.arc(touchMove.curX, touchMove.curY, 20 * S, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5 * S;
    ctx.stroke();
    ctx.restore();
  }

  // Aim Joystick (Right)
  if (touchAim && touchAim.active) {
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.beginPath();
    ctx.arc(touchAim.startX, touchAim.startY, 46 * S, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(110, 231, 255, 0.5)';
    ctx.lineWidth = 2 * S;
    ctx.stroke();

    ctx.fillStyle = 'rgba(110, 231, 255, 0.85)';
    ctx.beginPath();
    ctx.arc(touchAim.curX, touchAim.curY, 18 * S, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5 * S;
    ctx.stroke();
    ctx.restore();
  }

  // Dash Button (Bottom Right)
  const p = G.player;
  const dbX = W - 46 * S;
  const dbY = H - 42 * S;
  const dbR = 25 * S;

  ctx.save();
  const ready = p.dashCd <= 0;
  ctx.fillStyle = ready ? 'rgba(255, 120, 40, 0.35)' : 'rgba(30, 25, 45, 0.6)';
  ctx.beginPath();
  ctx.arc(dbX, dbY, dbR, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = ready ? '#ff8a3d' : 'rgba(255, 255, 255, 0.2)';
  ctx.lineWidth = 2.0 * S;
  ctx.stroke();

  if (!ready) {
    const cdFrac = 1 - (p.dashCd / p.dashMax);
    ctx.strokeStyle = '#6ee7ff';
    ctx.lineWidth = 2.8 * S;
    ctx.beginPath();
    ctx.arc(dbX, dbY, dbR, -Math.PI / 2, -Math.PI / 2 + cdFrac * TAU);
    ctx.stroke();
  }

  txt('DASH', dbX, dbY, 10 * S, ready ? '#ffffff' : 'rgba(255,255,255,0.4)', 'center', 700);
  ctx.restore();
}


// ─── [MODULE: render/renderer.js] ───

function drawWorld(now) {
  const p = G.player;

  // Camera translation for 5W x 3H world
  ctx.save();
  ctx.translate(-cam.x, -cam.y);

  // 1. World Ground Hex/Grid (Visible directional velocity)
  drawWorldGrid(cam, now);

  // 2. World Outer Boundary Glow Walls
  drawWorldWalls(cam, now);

  // 3. Shockwave Rings
  for (const rg of G.rings) {
    const a = clamp(rg.life / rg.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = a * 0.8;
    ctx.strokeStyle = rg.col;
    ctx.lineWidth = 2.5 * S;
    ctx.beginPath();
    ctx.arc(rg.x, rg.y, rg.r, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  // 4. Hazards (Artillery Mortar ground warning)
  for (const hz of G.hazards) {
    const pulse = 0.6 + 0.4 * Math.sin(now * 0.02);
    ctx.save();
    ctx.strokeStyle = hz.col;
    ctx.lineWidth = 2 * S;
    ctx.globalAlpha = pulse * 0.85;
    ctx.beginPath();
    ctx.arc(hz.x, hz.y, hz.r, 0, TAU);
    ctx.stroke();
    ctx.fillStyle = hz.col;
    ctx.globalAlpha = 0.15;
    ctx.fill();
    ctx.globalAlpha = pulse;
    txt('⚠', hz.x, hz.y, 14 * S, hz.col, 'center', 700);
    ctx.restore();
  }

  // 5. Enemy Beams (Direct from Boss / Beamer with directed telegraph)
  for (const bm of G.ebeams) {
    ctx.save();
    if (!bm.active) {
      const chargePulse = 0.5 + 0.5 * Math.sin(now * 0.03);
      ctx.strokeStyle = `rgba(239, 68, 68, ${0.5 + chargePulse * 0.45})`;
      ctx.lineWidth = (chargePulse * 2.2 + 1.8) * S;
      ctx.setLineDash([8 * S, 6 * S]);
      ctx.beginPath();
      ctx.moveTo(bm.x, bm.y);
      ctx.lineTo(bm.x + Math.cos(bm.ang) * bm.len, bm.y + Math.sin(bm.ang) * bm.len);
      ctx.stroke();
      ctx.setLineDash([]);
      drawGlow(SPR.red, bm.x, bm.y, 32 * S * chargePulse);
    } else {
      // Massive destructive red death ray (vibrant crimson & hot pink, no white)
      ctx.strokeStyle = 'rgba(239, 68, 68, 0.35)';
      ctx.lineWidth = bm.w * 1.7;
      ctx.beginPath();
      ctx.moveTo(bm.x, bm.y);
      ctx.lineTo(bm.x + Math.cos(bm.ang) * bm.len, bm.y + Math.sin(bm.ang) * bm.len);
      ctx.stroke();

      ctx.strokeStyle = '#dc2626';
      ctx.lineWidth = bm.w;
      ctx.beginPath();
      ctx.moveTo(bm.x, bm.y);
      ctx.lineTo(bm.x + Math.cos(bm.ang) * bm.len, bm.y + Math.sin(bm.ang) * bm.len);
      ctx.stroke();

      ctx.strokeStyle = '#ff1744';
      ctx.lineWidth = bm.w * 0.45;
      ctx.stroke();
    }
    ctx.restore();
  }

  // 6. Void Rifts
  for (const rf of G.rifts) {
    drawRiftVFX(rf, now);
  }

  // 7. XP Gems & Coins
  for (const g of G.gems) {
    drawGlow(g.isGold ? SPR.gemGold : SPR.gem, g.x, g.y, g.r * 8);
    const rad = g.r * (1 + 0.12 * Math.sin(now * 0.008 + g.ph));
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(now * 0.002 + g.ph);
    ctx.fillStyle = g.isGold ? '#ffd700' : '#8ee9ff';
    ctx.beginPath();
    ctx.moveTo(0, -rad); ctx.lineTo(rad, 0); ctx.lineTo(0, rad); ctx.lineTo(-rad, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // 8. Enemies (Using modular data-driven renderer)
  for (const e of G.enemies) {
    drawEnemyBody(e, now);
  }

  // 9. Black Holes
  for (const h of G.holes) {
    drawHoleVFX(h, now);
  }

  // 10. Powerups
  for (const pw of G.pows) {
    const blink = pw.life < 4 ? 0.35 + 0.65 * Math.abs(Math.sin(now * 0.012)) : 1;
    ctx.save();
    ctx.globalAlpha = blink;
    drawGlow(SPR.white, pw.x, pw.y, pw.r * 8);
    ctx.translate(pw.x, pw.y);
    ctx.rotate(now * 0.0016 + pw.ph);
    ctx.fillStyle = pw.col;
    rr(-pw.r, -pw.r, pw.r * 2, pw.r * 2, 5 * S);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1.5 * S;
    rr(-pw.r, -pw.r, pw.r * 2, pw.r * 2, 5 * S);
    ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = blink;
    txt(pw.icon, pw.x, pw.y + 0.5 * S, 9.5 * S, '#0b0a14', 'center', 800);
    ctx.restore();
  }

  // Flame Pools
  for (const fp of G.flamePools) {
    const pulse = 0.8 + 0.2 * Math.sin(now * 0.01 + fp.x);
    ctx.save();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.beginPath();
    ctx.arc(fp.x, fp.y, fp.r * pulse, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5 * S;
    ctx.stroke();
    ctx.restore();
  }

  // Rail Trails
  for (const rt of G.railTrails) {
    const a = clamp(rt.life / 1.5, 0, 1);
    ctx.save();
    ctx.globalAlpha = a * 0.8;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.lineWidth = 4 * S;
    ctx.beginPath();
    ctx.moveTo(rt.x, rt.y);
    ctx.lineTo(rt.x + Math.cos(rt.ang) * rt.len, rt.y + Math.sin(rt.ang) * rt.len);
    ctx.stroke();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5 * S;
    ctx.stroke();
    ctx.restore();
  }

  // Cryo Mines
  for (const m of G.mines) {
    const armed = m.armT <= 0;
    ctx.save();
    ctx.fillStyle = armed ? '#ffffff' : '#64748b';
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = armed ? '#f8fafc' : '#94a3b8';
    ctx.lineWidth = 1.5 * S;
    ctx.stroke();
    if (armed) {
      ctx.globalAlpha = 0.4 + 0.4 * Math.sin(now * 0.015);
      ctx.strokeStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r * 1.6, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Orbital Strikes
  for (const os of G.orbitalStrikes) {
    ctx.save();
    if (!os.active) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2 * S;
      ctx.setLineDash([4 * S, 4 * S]);
      ctx.beginPath();
      ctx.arc(os.x, os.y, os.r, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
      txt('TARGET LOCK', os.x, os.y - os.r - 8 * S, 8 * S, '#ffffff', 'center', 700);
    } else {
      const beamGrad = ctx.createLinearGradient(os.x - os.r, 0, os.x + os.r, 0);
      beamGrad.addColorStop(0, 'rgba(255, 255, 255, 0.2)');
      beamGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.98)');
      beamGrad.addColorStop(1, 'rgba(255, 255, 255, 0.2)');
      ctx.fillStyle = beamGrad;
      ctx.fillRect(os.x - os.r, cam.y - 200 * S, os.r * 2, H + 400 * S);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2 * S;
      ctx.beginPath();
      ctx.arc(os.x, os.y, os.r * 1.2, 0, TAU);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Gravity Tethers
  for (const tet of G.tethers) {
    const tgt = G.enemies.find(e => e.id === tet.targetId);
    if (tgt) {
      ctx.save();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.4 * S;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(tgt.x, tgt.y);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 1.0 * S;
      ctx.stroke();
      ctx.restore();
    }
  }

  // Graviton Scythes
  for (const sc of G.scythes) {
    const effR = sc.r * (sc.growScale || 1);
    ctx.save();
    ctx.translate(sc.x, sc.y);
    ctx.rotate(sc.rot);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3.5 * S;
    ctx.beginPath();
    ctx.arc(0, 0, effR, 0, Math.PI * 1.2);
    ctx.stroke();
    ctx.fillStyle = '#f8fafc';
    ctx.beginPath();
    ctx.arc(0, 0, effR * 0.4, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // Flak Shells
  for (const fs of G.flakShells) {
    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(fs.x, fs.y, fs.r, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  // Echo Phantoms
  for (const ec of G.echoes) {
    const a = clamp(ec.life / ec.maxLife, 0, 1) * 0.55;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(ec.x, ec.y);
    ctx.rotate(ec.ang);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
    ctx.beginPath();
    ctx.arc(0, 0, p.r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2 * S;
    ctx.stroke();
    ctx.restore();
  }

  // Swarm Drones
  if (p.swarmDrones && p.swarmDrones.length > 0) {
    for (const dr of p.swarmDrones) {
      ctx.save();
      ctx.translate(dr.x, dr.y);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, 4.5 * S, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 1.2 * S;
      ctx.stroke();
      ctx.restore();
    }
  }

  // Plasma Torch continuous flame cone
  if (p.flameActive > 0) {
    const fAng = getAimAngle(p);
    const reach = (120 + 15 * (p.flame || 1)) * S;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(fAng);
    const flameGrad = ctx.createRadialGradient(0, 0, 10 * S, reach * 0.8, 0, reach);
    flameGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
    flameGrad.addColorStop(0.3, 'rgba(240, 248, 255, 0.7)');
    flameGrad.addColorStop(0.7, 'rgba(220, 235, 255, 0.3)');
    flameGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = flameGrad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, reach, -0.44, 0.44);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // 11. Nukes / Rockets
  for (const n of G.nukes) {
    drawNukeProj(n);
  }

  // 12. Bouncing Disks
  for (const d of G.disks) {
    drawDiskProj(d, now);
  }

  // 13. Laser Beam
  if (p.laserActive > 0) {
    drawLaserBeam(p, now);
  }

  // 14. Player Bullets
  for (const b of G.bullets) {
    drawGlow(SPR.bullet, b.x, b.y, b.r * 8);
    ctx.strokeStyle = b.col || '#ffffff';
    ctx.lineWidth = b.r * 1.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.x - b.vx * 0.016, b.y - b.vy * 0.016);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  // 15. Enemy Bullets
  for (const b of G.ebullets) {
    drawGlow(SPR.shot, b.x, b.y, b.r * 9);
    ctx.fillStyle = b.col || '#ef4444';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, TAU);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 0.45, 0, TAU);
    ctx.fill();
  }

  // 16. Player Ship (Using modular data-driven renderer)
  drawPlayerShip(p, now);

  // 17. Directional Aim Reticle / Tracer line
  drawAimReticle(p);

  // 18. Orbit Drones
  if (p.drone > 0) {
    drawDroneOrbs(p);
  }

  // 19. Shield Ring
  if (p.shield > 0) {
    drawShieldRing(p, now);
  }

  // 20. Invulnerability Aura
  if (p.inv > 0 || p.aegisT > 0) {
    ctx.globalAlpha = p.aegisT > 0 ? 0.85 : 0.35 + 0.35 * Math.sin(now * 0.04);
    ctx.strokeStyle = p.aegisT > 0 ? '#ffd166' : '#8ecbff';
    ctx.lineWidth = p.aegisT > 0 ? 2.8 * S : 2 * S;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 6 * S, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // 21. Chain Lightning
  drawZapBolts(now);

  // 22. Particles
  for (const pt of G.parts) {
    const a = clamp(pt.life / pt.max, 0, 1);
    ctx.globalAlpha = a;
    if (pt.text) {
      txt(pt.text, pt.x, pt.y, pt.size, pt.col, 'center', 800);
    } else {
      ctx.fillStyle = pt.col;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, Math.max(0.4, pt.size * a), 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // 23. Combo Floating Banner
  if (G.combo >= 3 && G.comboT > 0) {
    const cFrac = clamp(G.comboT / 1.6, 0, 1);
    const cCol = G.combo >= 15 ? '#ff4d6d' : G.combo >= 10 ? '#ff9f1c' : G.combo >= 5 ? '#ffd166' : '#ffffff';
    const cText = G.combo >= 20 ? `×${G.combo} GODLIKE!` : G.combo >= 12 ? `×${G.combo} RAMPAGE!` : G.combo >= 7 ? `×${G.combo} CHAIN!` : `×${G.combo} COMBO`;
    ctx.save();
    ctx.globalAlpha = cFrac;
    txt(cText, p.x, p.y + p.r + 20 * S, 11 * S, cCol, 'center', 800);
    ctx.restore();
  }

  ctx.restore();

  // Screen space overlays
  drawMinimap(cam);
  drawVirtualJoysticks();
}

function drawPath(now) {
  if (!G.path.length) return;
  const p = G.player;
  const last = G.path[G.path.length - 1];
  ctx.save();
  ctx.strokeStyle = 'rgba(140,200,255,0.35)';
  ctx.lineWidth = 2 * S;
  ctx.setLineDash([5 * S, 9 * S]);
  ctx.lineDashOffset = -now * 0.03;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  for (const wp of G.path) ctx.lineTo(wp.x, wp.y);
  ctx.stroke();
  ctx.setLineDash([]);
  for (let i = 0; i < G.path.length - 1; i++) {
    ctx.fillStyle = 'rgba(140,200,255,0.5)';
    ctx.beginPath();
    ctx.arc(G.path[i].x, G.path[i].y, 3.2 * S, 0, TAU);
    ctx.fill();
  }
  const pulse = 0.55 + 0.45 * Math.sin(now * 0.012);
  ctx.globalAlpha = pulse;
  ctx.strokeStyle = '#8ecbff';
  ctx.lineWidth = 2 * S;
  ctx.beginPath();
  ctx.arc(last.x, last.y, 11 * S, 0, TAU);
  ctx.stroke();
  ctx.fillStyle = '#cfe8ff';
  ctx.beginPath();
  ctx.arc(last.x, last.y, 3.2 * S, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawBuffChip(x, y, icon, text, col, frac, alpha) {
  ctx.font = '700 ' + 9 * S + 'px ' + FONT;
  const tw = ctx.measureText(text).width;
  const h = 20 * S, w = 26 * S + tw + 10 * S;
  const cx = x + 11 * S, cy = y + h / 2 - 1 * S;

  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(10,8,20,0.68)';
  rr(x, y, w, h, h / 2);
  ctx.fill();
  ctx.strokeStyle = col;
  ctx.lineWidth = 1 * S;
  ctx.globalAlpha = alpha * 0.55;
  ctx.stroke();

  ctx.globalAlpha = alpha;
  ctx.strokeStyle = col;
  ctx.lineWidth = 1.6 * S;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (icon === 'rapid') {
    for (let k = 0; k < 2; k++) {
      const ox = cx - 3 * S + k * 4 * S;
      ctx.beginPath();
      ctx.moveTo(ox, cy - 4 * S);
      ctx.lineTo(ox + 3.5 * S, cy);
      ctx.lineTo(ox, cy + 4 * S);
      ctx.stroke();
    }
  } else if (icon === 'magnet') {
    ctx.beginPath();
    ctx.arc(cx, cy, 3.6 * S, Math.PI, 0, true);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - 3.6 * S, cy); ctx.lineTo(cx - 3.6 * S, cy - 4 * S);
    ctx.moveTo(cx + 3.6 * S, cy); ctx.lineTo(cx + 3.6 * S, cy - 4 * S);
    ctx.stroke();
  } else if (icon === 'slow') {
    ctx.beginPath();
    ctx.arc(cx, cy, 4 * S, 0, TAU);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - 2.6 * S);
    ctx.moveTo(cx, cy); ctx.lineTo(cx + 2 * S, cy);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(cx, cy - 4.5 * S);
    ctx.lineTo(cx + 4 * S, cy - 2 * S);
    ctx.lineTo(cx + 3 * S, cy + 2.5 * S);
    ctx.lineTo(cx, cy + 4.5 * S);
    ctx.lineTo(cx - 3 * S, cy + 2.5 * S);
    ctx.lineTo(cx - 4 * S, cy - 2 * S);
    ctx.closePath();
    ctx.stroke();
  }

  ctx.globalAlpha = alpha;
  txt(text, x + 22 * S, y + h / 2, 9 * S, col, 'left', 700);
  ctx.fillStyle = col;
  ctx.globalAlpha = alpha * 0.7;
  rr(x + 6 * S, y + h - 2.6 * S, Math.max(2 * S, (w - 12 * S) * clamp(frac, 0, 1)), 1.4 * S, 0.7 * S);
  ctx.fill();
  ctx.globalAlpha = 1;
  return w;
}


// ─── [MODULE: ui/hud.js] ───
// ═══════════════════════════════════════════════════════════════
// WINGS OF FIRE — IN-GAME HUD, RADAR MINIMAP & JOYSTICKS
// ═══════════════════════════════════════════════════════════════

function drawHud(now) {
  const pad = 12 * S;
  const p = G.player;

  // ═════════════════════════════════════════════════════════════════
  // 1. TOP STATUS BAR — WEAPONS, SKILLS, BUFFS, TIMER & STATS
  // ═════════════════════════════════════════════════════════════════
  const topH = 34 * S;
  ctx.fillStyle = 'rgba(7, 6, 13, 0.72)';
  ctx.fillRect(0, 0, W, topH);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
  ctx.lineWidth = 1 * S;
  ctx.beginPath();
  ctx.moveTo(0, topH);
  ctx.lineTo(W, topH);
  ctx.stroke();

  // Left: Run Timer & Level / Biome
  txt(fmt(G.t), pad, topH * 0.44, 15 * S, '#ffffff', 'left', 800);
  const diffCol = G.diff === 'hard' ? '#ff4d6d' : G.diff === 'normal' ? '#ffd166' : '#7bffb2';
  const envName = (G.env && ENVIRONMENTS[G.env]) ? ENVIRONMENTS[G.env].name.split(' ')[0] : 'NEON';
  txt(`LV ${G.level} · ${DIFF[G.diff].name.toUpperCase()} · ${envName}`, pad, topH * 0.82, 9 * S, diffCol, 'left', 700);

  // Center: Active Weapon Badges (Blue), Passive Skills (Yellow), and Temp Boosts
  let pillX = pad + 130 * S;
  const pillY = 6 * S, pillH = 22 * S;

  // Active Equipped Weapons (Blue cards from screenshot: #38bdf8)
  for (const wid of getLoadout()) {
    const wInfo = WEAPONS[wid];
    if (!wInfo) continue;
    const wLv = p[wid] || 1;
    const wName = (wInfo.name || wid).split(' ')[0].toUpperCase();
    const label = `${wName} ${wLv}`;
    ctx.font = '700 ' + (9.5 * S) + 'px ' + FONT;
    const tw = ctx.measureText(label).width;
    const pw = tw + 14 * S;
    if (pillX + pw > W - 140 * S) break;

    ctx.fillStyle = 'rgba(56, 189, 248, 0.16)';
    rr(pillX, pillY, pw, pillH, 4 * S);
    ctx.fill();
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 1 * S;
    ctx.stroke();
    txt(label, pillX + pw / 2, pillY + pillH / 2, 9.5 * S, '#9ef0ff', 'center', 700);
    pillX += pw + 5 * S;
  }

  // Active Passive Skills (Yellow badges: #facc15)
  const passives = [];
  if (p.dmg > 7) passives.push(`+${Math.round((p.dmg / 7 - 1) * 100)}% DMG`);
  if (p.crit > 0) passives.push(`+${Math.round(p.crit * 100)}% CRIT`);
  if (p.rate > 2.2) passives.push(`+${Math.round((p.rate / 2.2 - 1) * 100)}% SPD`);
  if (p.burn > 0) passives.push(`BURN ${p.burn}`);
  if (p.explode > 0) passives.push(`BLAST ${p.explode}`);
  if (p.lifesteal > 0) passives.push(`VAMP ${p.lifesteal}`);

  for (const pass of passives) {
    ctx.font = '700 ' + (9 * S) + 'px ' + FONT;
    const tw = ctx.measureText(pass).width;
    const pw = tw + 12 * S;
    if (pillX + pw > W - 140 * S) break;

    ctx.fillStyle = 'rgba(250, 204, 21, 0.15)';
    rr(pillX, pillY, pw, pillH, 4 * S);
    ctx.fill();
    ctx.strokeStyle = '#facc15';
    ctx.lineWidth = 1 * S;
    ctx.stroke();
    txt(pass, pillX + pw / 2, pillY + pillH / 2, 9 * S, '#fef08a', 'center', 700);
    pillX += pw + 5 * S;
  }

  // Active Temp Boosts (Frenzy, Aegis, Slow)
  if (p.buffRapid > 0) {
    const rLabel = `⚡ FRENZY (${Math.ceil(p.buffRapid)}s)`;
    ctx.font = '700 ' + (9 * S) + 'px ' + FONT;
    const pw = ctx.measureText(rLabel).width + 12 * S;
    if (pillX + pw <= W - 140 * S) {
      ctx.fillStyle = 'rgba(249, 115, 22, 0.25)';
      rr(pillX, pillY, pw, pillH, 4 * S);
      ctx.fill();
      ctx.strokeStyle = '#f97316';
      ctx.lineWidth = 1 * S;
      ctx.stroke();
      txt(rLabel, pillX + pw / 2, pillY + pillH / 2, 9 * S, '#fed7aa', 'center', 800);
      pillX += pw + 5 * S;
    }
  }
  if (p.aegisT > 0) {
    const aLabel = `🛡 AEGIS (${Math.ceil(p.aegisT)}s)`;
    ctx.font = '700 ' + (9 * S) + 'px ' + FONT;
    const pw = ctx.measureText(aLabel).width + 12 * S;
    if (pillX + pw <= W - 140 * S) {
      ctx.fillStyle = 'rgba(234, 179, 8, 0.25)';
      rr(pillX, pillY, pw, pillH, 4 * S);
      ctx.fill();
      ctx.strokeStyle = '#eab308';
      ctx.lineWidth = 1 * S;
      ctx.stroke();
      txt(aLabel, pillX + pw / 2, pillY + pillH / 2, 9 * S, '#fef08a', 'center', 800);
      pillX += pw + 5 * S;
    }
  }

  // Right: Kills & Coins & Pause Button
  const coinPulse = (G.goldFlash > 0 || G.coinFlash > 0) ? '#ffffff' : '#ffd166';
  txt(`💀 ${G.kills}  ·  🪙 ${G.coins || 0}`, W - 48 * S, topH * 0.5, 11 * S, coinPulse, 'right', 700);

  // Pause Button
  ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
  rr(W - 38 * S, 4 * S, 28 * S, 26 * S, 6 * S);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.lineWidth = 1 * S;
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  rr(W - 29 * S, 10 * S, 3 * S, 14 * S, 1 * S);
  ctx.fill();
  rr(W - 22 * S, 10 * S, 3 * S, 14 * S, 1 * S);
  ctx.fill();

  // ═════════════════════════════════════════════════════════════════
  // 2. BOTTOM COCKPIT DOCK — HEALTH, KINETIC BARRIER, XP & BOSS
  // ═════════════════════════════════════════════════════════════════
  const dockW = Math.min(520 * S, W - 24 * S);
  const dockX = (W - dockW) / 2;
  const dockY = H - 36 * S;

  // Boss bar docked cleanly above the player cockpit console
  const boss = G.enemies.find(e => e.boss);
  if (boss) {
    const bFrac = clamp(boss.hp / boss.maxHp, 0, 1);
    const enraged = boss.hp <= boss.maxHp * 0.5;
    const bNames = ['INFERNO DRAKE', 'VORTEX TITAN', 'STORM SENTINEL', 'NEXUS CORE', 'CHRONOS PRIME'];
    const bName = (enraged ? '⚡ ENRAGED ' : '👹 ') + bNames[boss.kit % 5] + ` (${Math.ceil(bFrac * 100)}%)`;
    const bossBarY = (p.shieldCap > 0 ? dockY - 36 * S : dockY - 26 * S);
    const bossBarW = Math.min(560 * S, W - 20 * S);
    const bossBarX = (W - bossBarW) / 2;

    txt(bName, W / 2, bossBarY - 6 * S, 11 * S, enraged ? '#ff3344' : '#ff7a45', 'center', 800);
    bar(bossBarX, bossBarY, bossBarW, 9 * S, bFrac, enraged ? '#ff2a4b' : '#ff3d6e');
  }

  // Kinetic Shield Barrier (if player has Shield Capacitor buffer)
  if (p.shieldCap > 0) {
    const shieldY = dockY - 11 * S;
    const sFrac = clamp(p.shieldCap / 120, 0, 1);
    ctx.fillStyle = 'rgba(6, 182, 212, 0.15)';
    rr(dockX, shieldY, dockW, 8 * S, 4 * S);
    ctx.fill();
    const sFillW = Math.max(8 * S, dockW * sFrac);
    ctx.fillStyle = '#06b6d4';
    rr(dockX, shieldY, sFillW, 8 * S, 4 * S);
    ctx.fill();
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 1 * S;
    ctx.stroke();
    txt(`🛡 SHIELD BARRIER: ${Math.round(p.shieldCap)}`, W / 2, shieldY + 4 * S, 7.5 * S, '#ffffff', 'center', 800);
  }

  // Player Core Health Bar
  const hpFrac = clamp(p.hp / p.maxHp, 0, 1);
  const hpCol = hpFrac < 0.28 ? '#ef4444' : hpFrac < 0.6 ? '#f59e0b' : '#10b981';
  ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
  rr(dockX, dockY, dockW, 14 * S, 7 * S);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
  ctx.lineWidth = 1 * S;
  ctx.stroke();

  if (hpFrac > 0) {
    const hpW = Math.max(14 * S, dockW * hpFrac);
    const hpGrad = ctx.createLinearGradient(dockX, 0, dockX + hpW, 0);
    hpGrad.addColorStop(0, hpCol);
    hpGrad.addColorStop(1, hpFrac < 0.28 ? '#dc2626' : '#34d399');
    ctx.fillStyle = hpGrad;
    rr(dockX, dockY, hpW, 14 * S, 7 * S);
    ctx.fill();
  }
  txt(`${Math.ceil(p.hp)} / ${p.maxHp} HP`, W / 2, dockY + 7 * S, 9.5 * S, '#ffffff', 'center', 800);

  // Redesigned Sleek XP Progress Bar
  const xpY = dockY + 17 * S, xpH = 8 * S;
  ctx.fillStyle = 'rgba(10, 16, 30, 0.85)';
  rr(dockX, xpY, dockW, xpH, xpH / 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)';
  ctx.lineWidth = 1 * S;
  ctx.stroke();

  const xpFrac = clamp(G.xp / G.xpNext, 0, 1);
  if (xpFrac > 0.001) {
    const xpGrad = ctx.createLinearGradient(dockX, 0, dockX + dockW * xpFrac, 0);
    xpGrad.addColorStop(0, '#06b6d4');
    xpGrad.addColorStop(1, '#38bdf8');
    ctx.fillStyle = xpGrad;
    rr(dockX, xpY, Math.max(xpH, dockW * xpFrac), xpH, xpH / 2);
    ctx.fill();
  }

  // Milestone pips at 25%, 50%, 75%
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
  ctx.lineWidth = 1 * S;
  for (const pip of [0.25, 0.5, 0.75]) {
    const px = dockX + dockW * pip;
    ctx.beginPath();
    ctx.moveTo(px, xpY + 1 * S);
    ctx.lineTo(px, xpY + xpH - 1 * S);
    ctx.stroke();
  }

  }
}

function inRect(x, y, r) {
  return !!r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
}

function enterShop() {
  mode = MODE.SHOP;
  modeAt = performance.now();
  shopNote = null;
  shopRects = { rows: [], back: null };
  if (G) G.path.length = 0;
}

function enterLoadout() {
  mode = MODE.LOADOUT;
  modeAt = performance.now();
  loadoutNote = null;
  loadoutPage = 0;
  loadoutRects = { rows: [], back: null, start: null, prevPage: null, nextPage: null };
  if (G) G.path.length = 0;
}

function weaponUpgradeCost(lvl) {
  return Math.min(2000000, Math.round(300 * Math.pow(1.24, Math.max(0, lvl - 1)) / 10) * 10);
}

function upgradeWeaponMastery(wid) {
  const m = masteryFor(wid);
  if (m.lv >= 30) {
    loadoutNote = { text: WEAPONS[wid].name.toUpperCase() + ' IS AT MAX LEVEL 30', until: performance.now() + 1300 };
    return false;
  }
  const cost = weaponUpgradeCost(m.lv);
  if (meta.coins < cost) {
    loadoutNote = { text: 'NEED ' + cost + ' COINS TO UPGRADE', until: performance.now() + 1300 };
    beep(180, 0.08, 'square', 0.02, -60);
    return false;
  }
  meta.coins -= cost;
  meta.weapons = meta.weapons || defaultMastery();
  meta.weapons[wid] = meta.weapons[wid] || { lv: 1, trees: {} };
  meta.weapons[wid].lv = Math.min(30, (meta.weapons[wid].lv || 1) + 1);
  saveMeta();
  loadoutNote = { text: WEAPONS[wid].name.toUpperCase() + ' UPGRADED TO LV ' + meta.weapons[wid].lv + '!', until: performance.now() + 1500 };
  beep(840, 0.07, 'triangle', 0.03, 200);
  setTimeout(() => beep(1260, 0.09, 'triangle', 0.03, 160), 80);
  return true;
}

function toggleLoadout(wid) {
  let lo = getLoadout();
  if (lo.includes(wid)) {
    if (lo.length <= 1) { loadoutNote = { text: 'EQUIP AT LEAST ONE WEAPON', until: performance.now() + 1300 }; return; }
    lo = lo.filter(id => id !== wid);
  } else {
    if (lo.length >= 3) { loadoutNote = { text: 'MAX 3 WEAPONS EQUIPPED', until: performance.now() + 1300 }; return; }
    lo.push(wid);
  }
  meta.loadout = lo;
  saveMeta();
  beep(700, 0.06, 'triangle', 0.02, 120);
}

function onDown(ev) {
  ev.preventDefault();

  const px = ev.clientX, py = ev.clientY;

    for (const r of shopRects.rows) if (inRect(px, py, r)) { buyPermanent(r.id); return; }

    return;
  }

    for (const dr of menuRects.diffs) {
      if (inRect(px, py, dr)) {
        meta.diff = dr.id;

        beep(750, 0.05, 'triangle', 0.03, 100);
        return;
      }
    }
    if (menuRects.biomes) {
      for (const br of menuRects.biomes) {

          meta.env = br.id;
          saveMeta();
          beep(820, 0.05, 'triangle', 0.03, 120);
          return;
        }
      }
    }
    if (inRect(px, py, menuRects.loadout)) { enterLoadout(); return; }
    if (inRect(px, py, menuRects.shop)) { enterShop(); return; }
    startGame();
    return;
  }
  if (mode === MODE.LOADOUT) {
    if (inRect(px, py, loadoutRects.back)) { mode = MODE.MENU; modeAt = performance.now(); return; }
    if (inRect(px, py, loadoutRects.start)) { startGame(); return; }
    loadoutTouchStartY = py;
    loadoutTouchStartScroll = loadoutScrollY;
    loadoutIsDragging = false;
    const scrollPy = py + loadoutScrollY;
    for (const r of loadoutRects.rows) {
      if (inRect(px, scrollPy, r.upgRect)) {
        upgradeWeaponMastery(r.id);
        return;
      }
      if (inRect(px, scrollPy, r)) {
        toggleLoadout(r.id);
        return;
      }
    }
    return;
  }
  if (mode === MODE.VICTORY) {
    if (inRect(px, py, victoryRects.restart)) { startGame(); return; }
    if (inRect(px, py, victoryRects.shop)) { enterShop(); return; }
    if (inRect(px, py, victoryRects.menu)) { mode = MODE.MENU; modeAt = performance.now(); return; }
    return;
  }
  if (mode === MODE.DEAD) {
    if (inRect(px, py, deadRects.restart)) { startGame(); return; }
    if (inRect(px, py, deadRects.shop)) { enterShop(); return; }
    if (inRect(px, py, deadRects.menu)) { mode = MODE.MENU; modeAt = performance.now(); return; }
    if (performance.now() - modeAt > 500) startGame();
    return;
  }
  if (mode === MODE.PAUSE) {
    if (inRect(px, py, pauseRects.resume)) { mode = MODE.PLAY; modeAt = performance.now(); return; }
    if (inRect(px, py, pauseRects.quit)) { mode = MODE.MENU; modeAt = performance.now(); return; }
    mode = MODE.PLAY;
    modeAt = performance.now();
    return;
  }
  if (mode === MODE.LEVEL) {
    if (performance.now() - modeAt < 160) return;
    if (G.bonusPick && inRect(px, py, G.skipRect)) { skipBonusPick(); return; }
    for (const r of G.cardRects) {
      if (inRect(px, py, r)) { pickCard(r.i); return; }
    }
    return;
  }
  if (mode === MODE.PLAY) {
    const now = performance.now();
    // Pause button tap (top-right)
    if (px >= W - 56 * S && py <= 16 + 56 * S) {
      mode = MODE.PAUSE;
      modeAt = now;
      if (G) G.path.length = 0;
      return;
    }

    // Dash button tap (bottom-right)
    if (Math.hypot(px - (W - 46 * S), py - (H - 42 * S)) <= 34 * S) {
      doDash();
      return;
    }

    // Double-tap anywhere to dash
    if (now - lastTapTime < 280) {
      doDash();
      lastTapTime = 0;

    }

    const p = G.player;
    if (ev.pointerType === 'mouse') {
      p.aimAng = Math.atan2(py + cam.y - p.y, px + cam.x - p.x);

    } else {

          id: ev.pointerId,
          startX: px,
          startY: py,

        };

function onMove(ev) {
  if (mode === MODE.LOADOUT && ev.buttons > 0) {
    const dy = ev.clientY - loadoutTouchStartY;
    if (Math.abs(dy) > 3) {
      loadoutIsDragging = true;
      loadoutScrollY = clamp(loadoutTouchStartScroll - dy, 0, loadoutMaxScroll);
    }
    return;
  }
  if (mode !== MODE.PLAY || !G) return;
  const px = ev.clientX, py = ev.clientY;
  const p = G.player;

  if (ev.pointerType === 'mouse') {
    p.aimAng = Math.atan2(py + cam.y - p.y, px + cam.x - p.x);
    p.hasAim = true;
  } else {
    if (touchMove && touchMove.active && touchMove.id === ev.pointerId) {
      touchMove.curX = px;
      touchMove.curY = py;
    }
    if (touchAim && touchAim.active && touchAim.id === ev.pointerId) {
      touchAim.curX = px;
      touchAim.curY = py;
      const adx = px - touchAim.startX;
      const ady = py - touchAim.startY;
      if (Math.hypot(adx, ady) > 6) {
        p.aimAng = Math.atan2(ady, adx);
        p.hasAim = true;
      }
    }
  }
}

function onUp(ev) {
  if (!G) return;
  if (touchMove && touchMove.id === ev.pointerId) {
    touchMove.active = false;
  }
  if (touchAim && touchAim.id === ev.pointerId) {
    touchAim.active = false;
  }
}

  if (mode === MODE.PLAY) {
    G.t += dt;
    updatePlayer(dt);

    if (G.t >= G.nextBoss) {
      G.nextBoss += Math.max(50, 85 - G.bossKills * 5);
      spawnEnemy('boss');
    }

    updateSpawn(dt);
    updateWeapons(dt);
    updateNukes(dt);
    updateDisks(dt);
    updateRifts(dt);
    updateMines(dt);
    updateScythes(dt);
    updateTethers(dt);
    updateParasites(dt);
    updateEchoes(dt);
    updateFlakShells(dt);
    updateOrbitalStrikes(dt);
    updateFlamePools(dt);
    updateRailTrails(dt);
    updateHazards(dt);
    updateEBeams(dt);
    updateRings(dt);
    updateEnemies(dt);
    updateHoles(dt);
    updateEnemyBullets(dt);
    updateBullets(dt);
    updateGems(dt);
    updatePows(dt);

    for (const m of MILESTONES) {
      if (!G.milestones.has(m.id) && m.check(G)) {
        G.milestones.add(m.id);
        G.toast = { text: m.label, t: 2.0, col: m.col };
        fanfare();
        haptic([40, 30, 80]);
      }
    }

    if (G.toast) { G.toast.t -= dt; if (G.toast.t <= 0) G.toast = null; }
    fire(dt);
    checkLevel();
    if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 30 * S);
    updateParts(dt);
  }
}

let last = performance.now();
function frame(now) {
  if (window.innerWidth !== W || window.innerHeight !== H) resize();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (mode === MODE.PLAY) update(dt, now);
  render(now);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);

})();
  </script>
</body>
